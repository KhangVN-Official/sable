name: Build iOS Dylib

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & iOS Target
        run: |
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Build sable_rapier
        run: |
          # Find the exact folder containing sable_rapier's Cargo.toml
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "Cargo.toml" | grep "sable_rapier"))
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          cargo build --target aarch64-apple-ios --release

      - name: Package Output
        run: |
          find . -name "*.dylib" -exec cp {} ./libsable_rapier_ios.dylib \;

      - uses: actions/upload-artifact@v4
        with:
          name: libsable_rapier_ios
          path: libsable_rapier_ios.dylib
